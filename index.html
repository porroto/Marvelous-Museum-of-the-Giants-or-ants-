<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Marvelous Museum of Giants & Ants</title><style>:root{--n:#10233b;--g:#c8a52d;--p:#fbf7ea;--t:#087d79;--c:#e45b37;--i:#202a36}*{box-sizing:border-box}body{margin:0;font:16px system-ui;background:var(--n);color:var(--i)}main{max-width:960px;margin:auto;padding:28px}.museum{background:var(--p);border-top:6px solid var(--g);border-radius:12px;padding:34px;box-shadow:0 20px 50px #0005}h1,h2,h3{font-family:Georgia,serif;color:var(--n)}h1{font-size:clamp(34px,7vw,64px);margin:.1em 0}.tag{color:var(--c);font:italic 22px Georgia}.lead{font-size:18px;line-height:1.6}.rooms{display:flex;gap:8px;overflow:auto;margin:24px 0}.rooms button,.btn,.mode button{border:0;border-radius:8px;padding:11px 14px;font-weight:800;cursor:pointer}.rooms button{background:#e8e1cd;color:var(--n);white-space:nowrap}.rooms button.on,.btn{background:var(--n);color:white}.mode{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mode button{background:white;border:2px solid #ddd5be;text-align:left;padding:20px}.mode button.on{border-color:var(--g);box-shadow:0 0 0 3px #c8a52d22}.mode strong{font:700 22px Georgia;display:block}.card{background:white;border:1px solid #e3dcc8;border-radius:10px;padding:18px;margin:16px 0}.notice{border-left:4px solid var(--t);padding:12px;background:#fff;margin:14px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #d9d0b8;border-radius:6px;font:inherit}textarea{min-height:80px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.measure{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:7px;margin:7px 0}.ok{color:var(--t);font-weight:800}.badge{text-align:center;font:700 28px Georgia;color:#967714;padding:24px}.small{font-size:13px;color:#667}.actions{display:flex;justify-content:space-between;margin-top:25px}@media(max-width:650px){main{padding:10px}.museum{padding:20px}.grid,.mode{grid-template-columns:1fr}.measure{grid-template-columns:1fr 1fr}.measure input:first-child{grid-column:1/-1}}</style></head><body><main><div class="museum"><div class="small">OPENLAB MISSION · MATH × ART × MAKING</div><h1>THE MARVELOUS MUSEUM</h1><div class="tag">of GIANTS & ants</div><p class="lead">Transform an everyday object while preserving its proportions. Measure it. Predict it. Build it. Prove it. Exhibit it.</p><nav class="rooms" id="nav"></nav><section id="view"></section></div></main><script>(()=>{const K='marvelous-museum-v2';const R=['Lobby','Select','Perceive','Alter','Realize','Prove','Keep'];let room=0,s=JSON.parse(localStorage.getItem(K)||'null')||{mode:'giants',name:'',class:'',object:'',materials:'',plan:'',structure:'',unit:'cm',factor:2,m:Array.from({length:8},()=>({n:'',o:'',p:'',check:false})),build:[false,false,false,false,false],before:'',during:'',after:'',difference:'',proof:'',hardest:'',proud:'',validate:[false,false,false,false,false]};const save=()=>localStorage.setItem(K,JSON.stringify(s)),q=x=>document.querySelector(x),esc=x=>String(x??'').replace(/[&<>"']/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[a]));function nav(){q('#nav').innerHTML=R.map((x,i)=>`<button class="${i===room?'on':''}" data-r="${i}">${i?i+'. ':''}${x}</button>`).join('');document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{room=+b.dataset.r;render()})}const actions=()=>`<div class="actions">${room?`<button class="btn" id="back">← Back</button>`:''}${room<R.length-1?`<button class="btn" id="next">Continue →</button>`:''}</div>`;function render(){nav();let h='';if(room===0)h=`<h2>Choose your world</h2><div class="mode"><button data-mode="giants" class="${s.mode==='giants'?'on':''}"><strong>▲ Land of the Giants</strong>Scale an object up.</button><button data-mode="ants" class="${s.mode==='ants'?'on':''}"><strong>▼ Land of the Ants</strong>Scale an object down.</button></div><div class="grid"><div><label>Designer</label><input id="name" value="${esc(s.name)}"></div><div><label>Class</label><input id="class" value="${esc(s.class)}"></div></div><div class="notice"><b>Mission rule:</b> every corresponding dimension changes by the same scale factor. The computer checks your math; you provide the reasoning and evidence.</div>`;if(room===1)h=`<h2>S · Select</h2><p>Choose a handheld, school-appropriate everyday object and imagine its transformation.</p><label>Object</label><input id="object" value="${esc(s.object)}"><label>Materials</label><textarea id="materials">${esc(s.materials)}</textarea><label>How will you build it?</label><textarea id="plan">${esc(s.plan)}</textarea>`;if(room===2)h=`<h2>P · Perceive</h2><p>Study before measuring. What shapes, edges, surfaces, internal and external structures make the object recognizable?</p><label>Structure analysis</label><textarea id="structure">${esc(s.structure)}</textarea><label>Best measurement unit</label><select id="unit"><option ${s.unit==='cm'?'selected':''}>cm</option><option ${s.unit==='in'?'selected':''}>in</option><option ${s.unit==='mm'?'selected':''}>mm</option></select><div class="notice">Identify at least <b>8 measurable features</b>. These become your evidence map in the next room.</div>`;if(room===3)h=`<h2>A · Alter</h2><p>Use one consistent scale factor. Make your prediction before checking.</p><label>Scale factor</label><select id="factor">${[2,3,5,10].map(x=>`<option ${s.factor==x?'selected':''}>${x}</option>`).join('')}</select><div class="small">${s.mode==='giants'?'GIANTS: multiply':'ANTS: divide'} every dimension by ${s.factor}.</div>${s.m.map((x,i)=>{let a=x.o===''?'':Math.round((s.mode==='giants'?+x.o*s.factor:+x.o/s.factor)*100)/100;return `<div class="measure"><input data-n="${i}" placeholder="Feature ${i+1}" value="${esc(x.n)}"><input type="number" data-o="${i}" placeholder="Original" value="${esc(x.o)}"><input type="number" data-p="${i}" placeholder="Prediction" value="${esc(x.p)}"><button class="btn" data-c="${i}">Check</button>${x.check?`<span class="ok">${Math.abs(+x.p-a)<.011?'✓ Correct':'Try again'} · ${a} ${s.unit}</span>`:''}</div>`}).join('')}`;if(room===4){let B=['Materials ready','Measured twice','Used transformed measurements','Recreated important visual details','Safe to transport/display'];h=`<h2>R · Realize</h2><p>Build the physical artifact. Document the messy middle—not only the finished product.</p>${B.map((x,i)=>`<label><input style="width:auto" type="checkbox" data-b="${i}" ${s.build[i]?'checked':''}> ${x}</label>`).join('')}<div class="grid"><div><label>Before evidence</label><input id="before" value="${esc(s.before)}"></div><div><label>During evidence</label><input id="during" value="${esc(s.during)}"></div></div><label>After evidence</label><input id="after" value="${esc(s.after)}"><label>Where did the build differ from the mathematical plan?</label><textarea id="difference">${esc(s.difference)}</textarea>`}if(room===5)h=`<h2>PROVE · Proportionality</h2><p>A finished sculpture is not yet proof. Use at least two measurements and explain why the model is proportional to the original.</p><div class="card"><b>Evidence snapshot</b>${s.m.filter(x=>x.n&&x.o).slice(0,8).map(x=>{let a=Math.round((s.mode==='giants'?+x.o*s.factor:+x.o/s.factor)*100)/100;return `<div>${esc(x.n)}: ${x.o} ${s.unit} → ${a} ${s.unit}</div>`}).join('')}</div><label>Mathematical proof — use two measurements and the scale factor</label><textarea id="proof">${esc(s.proof)}</textarea><label>What was hardest, and how did you solve it?</label><textarea id="hardest">${esc(s.hardest)}</textarea><label>What are you most proud of?</label><textarea id="proud">${esc(s.proud)}</textarea>`;if(room===6){let complete=s.object&&s.structure&&s.m.filter(x=>x.n&&x.o&&x.p&&x.check).length>=8&&s.proof;h=`<h2>K · Keep</h2><div class="card"><h3>${esc(s.object||'Untitled Exhibit')}</h3><p>Designer: <b>${esc(s.name||'—')}</b><br>World: <b>${s.mode==='giants'?'Land of the Giants':'Land of the Ants'}</b><br>Scale transformation: <b>${s.mode==='giants'?'×':'÷'}${s.factor}</b></p></div><h3>Human validation</h3>${['Selection & plan','Structure analysis','Measurements & scale math','Physical artifact & evidence','Proportionality explanation'].map((x,i)=>`<label><input style="width:auto" type="checkbox" data-v="${i}" ${s.validate[i]?'checked':''}> ${x}</label>`).join('')}<div class="badge">${complete?'🏅 MASTER OF SCALE':'🔒 MASTER OF SCALE · mission incomplete'}</div><div class="notice"><b>Museum-ready:</b> pair the physical exhibit with a privacy-safe QR proof page. Public visitors see the artifact and reasoning—not student-private data.</div><button class="btn" onclick="print()">Print Passport</button>`}q('#view').innerHTML=h+actions();bind()}function val(id,key){let e=q('#'+id);if(e)e.oninput=()=>{s[key]=e.value;save()}}function bind(){if(q('#back'))q('#back').onclick=()=>{room--;render()};if(q('#next'))q('#next').onclick=()=>{room++;render()};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{s.mode=b.dataset.mode;save();render()});[['name','name'],['class','class'],['object','object'],['materials','materials'],['plan','plan'],['structure','structure'],['before','before'],['during','during'],['after','after'],['difference','difference'],['proof','proof'],['hardest','hardest'],['proud','proud']].forEach(x=>val(...x));if(q('#unit'))q('#unit').onchange=e=>{s.unit=e.target.value;save()};if(q('#factor'))q('#factor').onchange=e=>{s.factor=+e.target.value;save();render()};document.querySelectorAll('[data-n]').forEach(e=>e.oninput=()=>{s.m[+e.dataset.n].n=e.value;save()});document.querySelectorAll('[data-o]').forEach(e=>e.oninput=()=>{let x=s.m[+e.dataset.o];x.o=e.value;x.check=false;save()});document.querySelectorAll('[data-p]').forEach(e=>e.oninput=()=>{let x=s.m[+e.dataset.p];x.p=e.value;x.check=false;save()});document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>{let x=s.m[+e.dataset.c];if(x.p==='')return alert('Make a prediction first.');x.check=true;save();render()});document.querySelectorAll('[data-b]').forEach(e=>e.onchange=()=>{s.build[+e.dataset.b]=e.checked;save()});document.querySelectorAll('[data-v]').forEach(e=>e.onchange=()=>{s.validate[+e.dataset.v]=e.checked;save()})}render()})();</script></body></html>
